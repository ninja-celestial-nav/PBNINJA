<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>匹克球砲台模式 · NINJAPB</title>
<meta name="description" content="放上一張臉當對手，用匹克球發球機狂轟。照片只留在你的裝置上。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#071E3D;--panel:rgba(9,34,68,.86);--line:#F3F7FB;--mute:#A9C2DE;--ball:#E4F23F;--danger:#FF6A4D;--rule:rgba(243,247,251,.2);
  --display:"Big Shoulders Display","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--line);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.box{background:var(--panel);border:1px solid var(--rule);backdrop-filter:blur(8px)}
button,.up{font:inherit;font-weight:700;font-size:14px;color:var(--line);background:transparent;border:1px solid var(--rule);padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn{background:var(--ball);color:var(--ink);border-color:var(--ball)}
#top{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px}
#top h1{margin:0 6px 0 0;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em}
#top h1 small{display:block;font-size:11px;letter-spacing:.14em;color:var(--ball);font-weight:800}
#top .sp{flex:1}
.up input{display:none}
#hud{position:fixed;right:12px;top:84px;padding:10px 12px;display:grid;gap:6px;min-width:170px}
#hud b{font-family:var(--display);font-size:30px;line-height:1;color:var(--ball)}
#hud .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:13px;color:var(--mute)}
#meter{height:10px;background:rgba(255,255,255,.12);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ball),var(--danger));transition:width .25s}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 14px;font-size:14px;text-align:center;pointer-events:none}
#win{position:fixed;left:50%;top:74%;transform:translate(-50%,-50%);padding:18px 22px;text-align:center;display:grid;gap:10px}
#win[hidden]{display:none}
#win h2{margin:0;font-family:var(--display);font-weight:900;font-size:34px;color:var(--ball)}
#priv{font-size:12px;color:var(--mute)}
@media (max-width:700px){#top h1{font-size:18px}#hud{top:auto;bottom:64px;right:8px;min-width:140px}#top{left:8px;right:8px;top:8px}#priv{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="box">
  <h1><small>NINJAPB · CANNON</small>砲台模式</h1>
  <label class="up btn">上傳對手照片<input type="file" id="file" accept="image/*"></label>
  <button id="clear">換回忍者臉</button>
  <span id="priv">照片只在你的裝置上處理，不會上傳</span>
  <span class="sp"></span>
  <a href="/" class="up" style="text-decoration:none">← 回到戰術場</a>
</div>
<div id="hud" class="box">
  <div class="row"><span>命中</span><b id="hits">0</b></div>
  <div class="row"><span>打臉</span><b id="faces">0</b></div>
  <div class="row"><span>哀嚎值</span><span id="pct">0%</span></div>
  <div id="meter"><i></i></div>
</div>
<div id="hint" class="box">點畫面任何地方發射，瞄準對手的臉！</div>
<div id="win" class="box" hidden><h2>對手投降了！</h2><div id="winTxt"></div><button class="btn" id="again">再來一輪</button></div>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/GLTFLoader.js"></script>
<script src="/rig.js"></script>
<script src="/mascot.js"></script>
<script src="/cannon/cannon.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
